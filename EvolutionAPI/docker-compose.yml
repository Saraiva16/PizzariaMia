services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DANGEROUS_FUNCTIONS=true
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=PizzariaMiaSecretKey123!
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO
      # CONFIGURAÇÕES DO BANCO DE DADOS (PostgreSQL)
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@evolution-postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      # REDIS
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      # WEBHOOK (Desativado globalmente, ativaremos via API depois)
      - WEBHOOK_GLOBAL_ENABLED=false
    depends_on:
      - evolution-postgres
      - evolution-redis

  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=evolution
    ports:
      - "5432:5432"
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - evolution-redis-data:/data

volumes:
  evolution-postgres-data:
  evolution-redis-data:
